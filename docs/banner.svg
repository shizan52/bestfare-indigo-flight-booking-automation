<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Best Fare - IndiGo flight booking automation: desktop app, licence server, admin panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#1d2380"/>
      <stop offset="1" stop-color="#3f43d0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c83ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c83ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#eef0ff" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04061a" flood-opacity="0.55"/>
    </filter>
    <clipPath id="round"><rect width="1280" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
    <!-- a flight path across the banner -->
    <path d="M-20 300 C 260 120, 520 330, 820 150 S 1180 60, 1320 120" fill="none" stroke="#9aa3ff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <g fill="#ffffff" fill-opacity="0.5">
      <circle cx="140" cy="318" r="2"/><circle cx="360" cy="44" r="1.6"/><circle cx="640" cy="320" r="1.8"/><circle cx="930" cy="40" r="1.5"/><circle cx="1210" cy="300" r="2"/>
      <circle cx="80" cy="90" r="1.4"/><circle cx="520" cy="190" r="1.2"/><circle cx="1100" cy="190" r="1.4"/>
    </g>
    <!-- logo -->
    <g transform="translate(70 70)">
      <rect width="92" height="92" rx="24" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <path d="M22 47 72 22 55 72 45 52z" fill="#ffffff"/>
    </g>
    <text x="186" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="-1">Best Fare</text>
    <text x="72" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#e4e7ff">IndiGo flight booking automation</text>
    <text x="72" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#b9bfff">Desktop app  ·  licence server  ·  admin panel  ·  signed auto-updates</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
      <rect x="72" y="278" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/><text x="131" y="299" text-anchor="middle" fill="#ffffff">Python 3</text>
      <rect x="200" y="278" width="102" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/><text x="251" y="299" text-anchor="middle" fill="#ffffff">PyQt6</text>
      <rect x="312" y="278" width="102" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/><text x="363" y="299" text-anchor="middle" fill="#ffffff">aiohttp</text>
      <rect x="424" y="278" width="102" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/><text x="475" y="299" text-anchor="middle" fill="#ffffff">SQLite</text>
      <rect x="536" y="278" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.14"/><text x="611" y="299" text-anchor="middle" fill="#ffffff">DevTools (CDP)</text>
    </g>
    <!-- a stylised app window -->
    <g transform="translate(790 52)" filter="url(#shadow)">
      <rect width="400" height="262" rx="16" fill="url(#card)"/>
      <path d="M0 16a16 16 0 0 1 16-16h368a16 16 0 0 1 16 16v26H0z" fill="#e7e9fb"/>
      <circle cx="22" cy="21" r="5" fill="#ff6b6b"/><circle cx="40" cy="21" r="5" fill="#ffc94d"/><circle cx="58" cy="21" r="5" fill="#3ddc97"/>
      <rect x="0" y="42" width="96" height="220" fill="#1d2380"/>
      <rect x="14" y="62" width="68" height="10" rx="5" fill="#ffffff" fill-opacity="0.9"/>
      <rect x="14" y="88" width="56" height="8" rx="4" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="14" y="108" width="62" height="8" rx="4" fill="#ffffff" fill-opacity="0.45"/>
      <text x="116" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2140">Choose your flight</text>
      <rect x="116" y="88" width="264" height="50" rx="10" fill="#f1f2ff" stroke="#3f43d0" stroke-width="2"/>
      <text x="130" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2140">20:25 → 01:42</text>
      <text x="366" y="110" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3f43d0">₹4,720</text>
      <text x="130" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0d8a5b" font-weight="700">Offer applied</text>
      <rect x="116" y="146" width="264" height="40" rx="10" fill="#ffffff" stroke="#e3e7f1"/>
      <rect x="130" y="160" width="96" height="9" rx="4" fill="#cfd3ea"/><rect x="316" y="160" width="50" height="9" rx="4" fill="#cfd3ea"/>
      <rect x="116" y="198" width="264" height="42" rx="12" fill="#3f43d0"/>
      <text x="248" y="224" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Continue · ₹4,720</text>
    </g>
  </g>
</svg>

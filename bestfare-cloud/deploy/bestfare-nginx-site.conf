# Best Fare cloud - the public names on the ordinary https port:
#     https://{{HOST}}    the page people install from (/install), the file (/download/...), and what the apps talk to (/api/v1/)
#     https://{{ADMIN}}   the admin panel (/admin/) - the owner and the admins sign in here
# Installed as /etc/nginx/conf.d/bestfare-site.conf by deploy_cloud.py (a NEW file: no existing site's configuration is edited; `nginx -t` must pass before nginx is
# reloaded - a reload keeps every other site running). The server picks a site by the name the visitor asked for, so these blocks match ONLY these two names.
# The two names never serve each other's pages: the panel host has no /api/v1/, /install or /download; the app host has no /admin.

limit_req_zone  $binary_remote_addr  zone=bfsite_api:10m    rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=bfsite_page:10m   rate=5r/s;
limit_req_zone  $binary_remote_addr  zone=bfsite_dl:10m     rate=20r/m;
limit_req_zone  $binary_remote_addr  zone=bfsite_admin:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr  zone=bfsite_login:10m  rate=12r/m;
limit_conn_zone $binary_remote_addr  zone=bfsite_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name {{HOST}} {{ADMIN}};
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {                # (certificate renewal)
        root /var/www/bestfare-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── the apps and the download page ──────────────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {{HOST}};

    ssl_certificate      /etc/letsencrypt/live/{{HOST}}/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/{{HOST}}/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_timeout  1h;
    ssl_session_tickets  off;
    server_tokens        off;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size    300k;
    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            300s;
    limit_conn              bfsite_conn 30;

    location = /healthz {
        proxy_pass http://127.0.0.1:8780;
    }
    location /api/v1/ {
        limit_req             zone=bfsite_api burst=60 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $remote_addr;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
    location = / {
        limit_req             zone=bfsite_page burst=20 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-Proto https;
    }
    location = /install {
        limit_req             zone=bfsite_page burst=20 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-Proto https;
    }
    location = /download/install.css {
        limit_req             zone=bfsite_page burst=20 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-Proto https;
    }
    location = /download/BestFare-Setup.exe {
        limit_req             zone=bfsite_dl burst=10 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_buffering       off;                                 # the file goes straight through (no temporary copy on the disk)
        proxy_read_timeout    300s;
    }
    location / {
        return 404;
    }
}

# ── the admin panel ─────────────────────────────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {{ADMIN}};

    ssl_certificate      /etc/letsencrypt/live/{{HOST}}/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/{{HOST}}/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_timeout  1h;
    ssl_session_tickets  off;
    server_tokens        off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;            # (a login page is not for search engines)

    client_max_body_size    300k;
    client_body_timeout     15s;
    client_header_timeout   15s;
    limit_conn              bfsite_conn 30;

    location = / {
        return 302 /admin/;
    }
    location = /admin {
        return 301 /admin/;
    }
    location = /admin/api/login {                                  # (a person types a password: a few tries a minute is plenty; the server also locks the account)
        limit_req             zone=bfsite_login burst=5 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $remote_addr;
        proxy_set_header      X-Forwarded-Proto https;
    }
    location ~ ^/admin/api/(installers|releases)$ {                # (the developer's tools upload the installer / a release here: large, streamed, never buffered)
        client_max_body_size  400m;
        client_body_timeout   900s;
        proxy_request_buffering off;
        limit_req             zone=bfsite_admin burst=20 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $remote_addr;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_read_timeout    900s;
        proxy_send_timeout    900s;
    }
    location /admin/ {
        limit_req             zone=bfsite_admin burst=40 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $remote_addr;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_read_timeout    60s;
    }
    location / {
        return 404;
    }
}

# Best Fare cloud - STEP 1 of adding the public names {{HOST}} and {{ADMIN}}: only the plain-http door that lets Let's Encrypt check they are ours.
# Installed as /etc/nginx/conf.d/bestfare-site.conf by deploy_cloud.py (--site), then replaced by bestfare-site.conf's final form (bestfare-nginx-site.conf).
# It matches ONLY these two names: every other site on this server keeps answering exactly as before.
server {
    listen 80;
    listen [::]:80;
    server_name {{HOST}} {{ADMIN}};
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bestfare-acme;
        default_type text/plain;
    }
    location / {
        return 404;
    }
}

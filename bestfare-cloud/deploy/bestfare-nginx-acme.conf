# Best Fare cloud - STEP 1 of the domain install: only the plain-http door that lets Let's Encrypt check that {{HOST}} is ours.
# Installed as /etc/nginx/conf.d/bestfare.conf by deploy_cloud.py, then replaced by bestfare-nginx-domain.conf once the certificate exists.
# It matches ONLY the name {{HOST}}: every other site on this server keeps answering exactly as before.
server {
    listen 80;
    listen [::]:80;
    server_name {{HOST}};
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bestfare-acme;
        default_type text/plain;
    }
    location / {
        return 404;
    }
}

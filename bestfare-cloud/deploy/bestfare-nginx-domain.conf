# Best Fare cloud - the public door, on its own name and its own port: https://{{HOST}}:8443
# Installed as /etc/nginx/conf.d/bestfare.conf by deploy_cloud.py (a NEW file: no existing site's configuration is edited; `nginx -t` must pass
# before nginx is reloaded - a reload keeps every other site running). Port 8443 is its own: nothing else listens there, and the other sites
# (ports 80/443) are not touched - the plain-http block below matches ONLY the name {{HOST}}, for the certificate check and renewal.
#
# Reachable from the internet:  /api/v1/ (the apps)   /install and /download/ (the page and the file people get)   /healthz
# NOT reachable: the admin panel. Use an SSH tunnel:  ssh -L 8780:127.0.0.1:8780 root@<server>   then  http://127.0.0.1:8780/admin/

limit_req_zone  $binary_remote_addr  zone=bestfare_api:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=bestfare_page:10m  rate=5r/s;
limit_req_zone  $binary_remote_addr  zone=bestfare_dl:10m    rate=20r/m;
limit_conn_zone $binary_remote_addr  zone=bestfare_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name {{HOST}};
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {                # (certificate renewal)
        root /var/www/bestfare-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name {{HOST}};

    ssl_certificate      /etc/letsencrypt/live/{{HOST}}/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/{{HOST}}/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_timeout  1h;
    ssl_session_tickets  off;
    server_tokens        off;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size    300k;                 # the apps send small signed requests; installers and releases are uploaded through the tunnel, not here
    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            300s;                 # (a slow connection downloading the installer)
    limit_conn              bestfare_conn 30;

    location = /healthz {
        proxy_pass http://127.0.0.1:8780;
    }

    location /api/v1/ {
        limit_req             zone=bestfare_api burst=60 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        # the address the app really came from (whatever the caller put in these headers is replaced, never trusted)
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $remote_addr;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location = / {
        limit_req             zone=bestfare_page burst=20 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
    }
    location = /install {
        limit_req             zone=bestfare_page burst=20 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
    }
    location = /download/install.css {
        limit_req             zone=bestfare_page burst=20 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
    }
    location = /download/BestFare-Setup.exe {
        limit_req             zone=bestfare_dl burst=10 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_buffering       off;                                 # the file goes straight through (no temporary copy on the disk)
        proxy_read_timeout    300s;
    }

    location / {
        return 404;
    }
}

# Best Fare cloud - the door the apps use. Installed as /etc/nginx/conf.d/bestfare.conf by deploy_cloud.py
# (a NEW file: no existing site's configuration is edited; deploy_cloud.py runs `nginx -t` first and reloads only when it passes).
#
# Only /api/v1/ and /healthz are reachable from the internet. The admin panel is NOT published here: reach it through an SSH tunnel
#     ssh -L 8780:127.0.0.1:8780 root@<server>      then open  http://127.0.0.1:8780/admin/
# so that nobody on the internet can even see its login page.

limit_req_zone  $binary_remote_addr  zone=bestfare_api:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr  zone=bestfare_conn:10m;

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate      /etc/ssl/bestfare/server.crt;
    ssl_certificate_key  /etc/ssl/bestfare/server.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_timeout  1h;
    ssl_session_tickets  off;
    server_tokens        off;

    client_max_body_size    300k;                 # the apps send small signed requests; releases are uploaded through the tunnel, not here
    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            60s;
    limit_conn              bestfare_conn 30;

    location = /healthz {
        proxy_pass http://127.0.0.1:8780;
    }

    location /api/v1/ {
        limit_req             zone=bestfare_api burst=60 nodelay;
        proxy_pass            http://127.0.0.1:8780;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        # the address the app really came from (whatever the caller put in these headers is replaced, never trusted)
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $remote_addr;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location / {
        return 404;
    }
}
